# SPDX-License-Identifier: MIT OR Apache-2.0
[package]
name = "unemu-core-api"
# The package version is the contract's: 0.3.0 is CONTRACT 0.3 (docs/versioning.md).
version = "0.3.0"
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unemu-org/unemu-core-api"
description = "The contract between front ends and emulator cores: a core that describes itself and creates machines, and the machine a front end drives."
readme = "README.md"
keywords = ["emulator", "emulation", "frontend", "core", "contract"]
categories = ["emulators"]
# Consumers pin a git revision until 1.0; the crate goes to crates.io from 1.0.
publish = false

# No dependencies of any kind, also none for tests: nothing in the contract
# may force a version of another crate on a core.

[features]
# A storage and content in memory (`test_support`), for the tests of cores
# and front ends. No dependency comes with it.
test-support = []

# The root package is also a workspace. Its second member, `files`, is the
# contract's objects over host files; it depends on this package, never the
# other way round, and the checks of "no dependency" and "no host" stay with
# this package.
[workspace]
members = [".", "files"]
resolver = "2"
